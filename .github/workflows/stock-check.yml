name: Switch 2 Zelda Edition Stock Check

on:
  schedule:
    # Every 5 minutes — the fastest interval GitHub Actions supports.
    - cron: '*/5 * * * *'
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab

permissions:
  contents: write # needed so the job can commit state.json back to the repo

concurrency:
  group: switch2-scout
  cancel-in-progress: false # never cancel a run that might be mid-Discord-post

jobs:
  check-stock:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run stock check
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node src/scout.js

      - name: Commit state changes (if any)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "Update stock state"
          git push
